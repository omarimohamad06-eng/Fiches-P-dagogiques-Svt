name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Configuration de GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Préparation du site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp README.md _site/README.md
          touch _site/.nojekyll

      - name: Envoi de l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Déploiement
        id: deployment
        uses: actions/deploy-pages@v4
